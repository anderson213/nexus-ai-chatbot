services:
  - type: web
    name: nexus-ai-chatbot
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: gunicorn --no-control-socket --bind "0.0.0.0:$PORT" --workers 1 --threads 4 --timeout 65 app:app
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: GEMINI_API_KEY
        sync: false
